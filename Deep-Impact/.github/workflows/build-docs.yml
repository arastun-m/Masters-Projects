name: Build Documentation

on:
  push:
    branches:
      - main
      # - '**'
    paths:
      - '**/*.py'
      - '**/*.rst'
      - '**/*.ipynb'
  pull_request:
    branches:
      - main
      # - '**'
    paths:
      - '**/*.py'
      - '**/*.rst'
      - '**/*.ipynb'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch the full history for all branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 

      - name: Set Up Git Branch
        run: |
          git checkout main

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install sphinx

      # - name: Install LaTeX dependencies
      #   run: |
      #     sudo apt-get update && sudo apt-get install -y texlive-latex-extra latexmk

      - name: Build Sphinx Documentation
        run: |
          sphinx-build -b html docs/ docs/_build/html  # Build HTML docs
          
      # - name: Build LaTeX PDF
      #   run: |
      #     cd docs/_build/latex
      #     latexmk -pdf acsefunctions.tex

      # - name: Upload PDF
      #   uses: actions/upload-artifact@v3
      #   with:
      #     name: documentation-pdf
      #     path: docs/_build/latex/*.pdf

      - name: Upload HTML documentation
        uses: actions/upload-artifact@v3
        with:
          name: documentation-html
          path: docs/_build/html/*.html

      - name: Check for Changes
        id: check_changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git diff --exit-code docs/_build/html || echo "changes" > changes.txt
          echo "::set-output name=changes::$(cat changes.txt)"  # Set output variable for condition

      - name: Commit and Push Changes
        if: steps.check_changes.outputs.changes != ''
        run: |
          git config pull.rebase false  # Set to merge
          git pull origin main --allow-unrelated-histories || {
            echo "Merge conflict detected. Aborting."
            exit 1
          }
          git add docs/_build/* 
          git commit -m "Update documentation" || echo "No changes to commit"  # Avoid error if nothing to commit
          git push origin main # Push the changes